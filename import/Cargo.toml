[package]
name = "retifs-map-import"
description = "Builds a map library: vector tiles (and later a gazetteer) from an OpenStreetMap extract into retifs records (ADR-0028)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "retifs-map-import"
path = "src/main.rs"

[dependencies]
libretifs = { path = "../../retifs/crates/libretifs" }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
