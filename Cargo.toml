[workspace]
resolver = "2"
members = ["core", "gtk", "windows", "import", "android/jni", "haiku/capi"]
# The GTK front end builds only where GTK 4 and libadwaita are installed (Linux),
# the Windows one only on Windows.
default-members = ["core", "import"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false
