[package]
name = "retifs-map-capi"
description = "retifs Map for Haiku: the shared core to C (the BeAPI front end), JSON and tile draw lists"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true

[lib]
name = "retifs_map"
# rlib too: the Android app calls the same functions (android/jni).
crate-type = ["cdylib", "rlib"]

[dependencies]
retifs-map-core = { path = "../../core" }
serde_json = "1"
# The place icons (SVG) drawn here, for the BeAPI (no SVG of its own); no text in them.
resvg = { version = "0.45.1", default-features = false }
