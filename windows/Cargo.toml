[package]
name = "retifs-map-win"
description = "retifs Map for Windows: plain Win32, the map drawn with Direct2D from the map library's tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "retifs-map"
path = "src/main.rs"

[dependencies]
retifs-map-core = { path = "../core" }
libretifs = { path = "../../retifs/crates/libretifs" }

[target.'cfg(windows)'.dependencies]
# The place icons (SVG, white) drawn for the markers, as the Haiku app does.
resvg = { version = "0.45.1", default-features = false }
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
