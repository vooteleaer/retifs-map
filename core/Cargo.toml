[package]
name = "retifs-map-core"
description = "Places on retifs: every record with a geo (ADR-0027), whatever it is, through libretifs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libretifs = { path = "../../retifs/crates/libretifs" }
tokio = { version = "1", features = ["rt"] }
serde_json = "1"
# Address search folds text as the importer does (NFKD, no marks).
unicode-normalization = "0.1"
# Vector tiles, gzipped as some tile makers write them (the Haiku app draws them).
flate2 = "1"
